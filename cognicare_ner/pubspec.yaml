name: cognicare_ner
description: "CogniCare NER - dementia-care platform (patient / caregiver / doctor)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# Versions below are pinned (exact) to the latest stable compatible releases
# resolved at project creation time.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase (initialization is intentionally NOT wired up yet)
  firebase_core: 4.14.0
  cloud_firestore: 6.9.0
  firebase_auth: 6.6.0
  firebase_storage: 13.5.0

  # Local storage / persistence
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: 2.1.6

  # Connectivity + charts + notifications
  connectivity_plus: 7.3.1
  fl_chart: 1.2.0
  flutter_local_notifications: 22.3.0

  # Speech / audio (patient-facing features)
  flutter_tts: 4.2.5
  speech_to_text: 7.4.0
  just_audio: 0.10.6
  record: 7.1.1

  # UI / utilities
  google_fonts: 8.2.1
  uuid: 4.6.0
  intl: 0.20.2
  http: 1.6.0
  flutter_dotenv: 6.0.1
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

  # Codegen (Hive type adapters)
  hive_generator: 2.0.1
  build_runner: 2.4.13

# The following section is specific to Flutter packages.
flutter:

  # Generate localizations (AppLocalizations) from lib/l10n/*.arb (l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Registered asset directories. Placeholder .gitkeep files keep the
  # directories present until real assets are added.
  assets:
    - .env
    - assets/
    - assets/sounds/
    - assets/images/
    - assets/fonts/
