name: cognicare_ner
description: "NAWAL — Giving a new life. AI-powered cognitive care platform for elderly dementia patients in the North Eastern Region."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: 4.14.0
  cloud_firestore: 6.9.0
  firebase_auth: 6.6.0
  firebase_storage: 13.5.0

  # Local storage / persistence
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: 2.1.6
  shared_preferences: ^2.5.3

  # Connectivity + charts + notifications
  connectivity_plus: 7.3.1
  fl_chart: 1.2.0
  flutter_local_notifications: 22.3.0

  # Speech / audio (patient-facing features)
  flutter_tts: 4.2.5
  speech_to_text: 7.4.0
  just_audio: 0.10.6
  record: 7.1.1

  # Media (caregiver input)
  image_picker: ^1.1.2
  file_picker: ^9.2.2
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  permission_handler: ^11.4.0

  # UI / utilities
  google_fonts: 8.2.1
  uuid: 4.6.0
  intl: 0.20.2
  http: 1.6.0
  flutter_dotenv: 6.0.1
  web: 1.1.1
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Codegen (Hive type adapters)
  hive_generator: 2.0.1
  build_runner: 2.4.13

flutter:

  generate: true

  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/sounds/
    - assets/images/
    - assets/images/family/
    - assets/fonts/
